name: java CI with maven

on:
  push:
    branches: ["main", "dev", "prod-support","mystery"]
  pull_request:
    branches: ["main", "dev", "prod-support", "mystery"]



jobs:


    build:
      name: Application Build
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v1
        - name: Set up JDK 21
          uses: actions/Setup-java@v1
          with:
            distribution: termurin
            java-version: 21
        - name: Maven Package
          run: mvn -B clean package




